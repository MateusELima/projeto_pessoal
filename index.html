<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressão de Carga</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🏋️ Progressão de Carga</h1>
    <p class="subtitulo">Organize seus treinos e acompanhe sua evolução.</p>

    <!-- TREINO -->
    <div class="card">

        <h2>Meu Treino</h2>

        <label>Dia do treino</label>
        <select id="diaTreino" onchange="carregarExerciciosDoDia()">
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select>

        <label>Nome do treino</label>

        <input
            type="text"
            id="nomeTreino"
            placeholder="Ex: Peito e Tríceps"
        >

        <button
            class="btnAzul"
            onclick="salvarNomeTreino()"
        >
            Salvar nome do treino
        </button>

        <!-- EXERCÍCIO -->

        <label>Exercício</label>

        <div class="linha-exercicio">

            <select id="exercicio"></select>

            <button
                class="btnNovo"
                onclick="mostrarCadastroExercicio()"
            >
                + Novo
            </button>

        </div>

        <!-- CADASTRO -->

        <div
            id="cadastroExercicio"
            class="caixaEdicao"
        >

            <h3>Novo exercício</h3>

            <label>Nome</label>

            <input
                type="text"
                id="novoExercicio"
                placeholder="Ex: Supino Reto"
            >

            <label>Dia</label>

            <select id="diaNovoExercicio">
                <option value="segunda">Segunda-feira</option>
                <option value="terca">Terça-feira</option>
                <option value="quarta">Quarta-feira</option>
                <option value="quinta">Quinta-feira</option>
                <option value="sexta">Sexta-feira</option>
                <option value="sabado">Sábado</option>
                <option value="domingo">Domingo</option>
            </select>

            <button onclick="cadastrarExercicio()">
                Cadastrar exercício
            </button>

        </div>

        <!-- SÉRIES -->

        <label>Quantidade de séries</label>

        <select
            id="series"
            onchange="gerarSeries()"
        >
            <option value="1">1 série</option>
            <option value="2">2 séries</option>
            <option value="3" selected>3 séries</option>
            <option value="4">4 séries</option>
            <option value="5">5 séries</option>
            <option value="6">6 séries</option>
        </select>

        <div id="camposSeries"></div>

        <button
            class="btnRegistrar"
            onclick="registrarTreino()"
        >
            Registrar treino
        </button>

    </div>


    <!-- RESULTADO -->

    <div
        id="resultado"
        class="resultado"
    ></div>


    <!-- MINHA SEMANA -->

    <div class="card">

        <h2>📅 Minha Semana</h2>

        <p class="textoAjuda">
            Aqui você pode editar, mover ou excluir os exercícios da sua ficha.
        </p>

        <div id="fichaSemanal"></div>

    </div>


    <!-- JANELA DE EDIÇÃO -->

    <div
        id="modalEdicao"
        class="modal"
    >

        <div class="modalConteudo">

            <h2>✏️ Editar exercício</h2>

            <label>Nome do exercício</label>

            <input
                type="text"
                id="editarNomeExercicio"
            >

            <label>Dia do exercício</label>

            <select id="editarDiaExercicio">
                <option value="segunda">Segunda-feira</option>
                <option value="terca">Terça-feira</option>
                <option value="quarta">Quarta-feira</option>
                <option value="quinta">Quinta-feira</option>
                <option value="sexta">Sexta-feira</option>
                <option value="sabado">Sábado</option>
                <option value="domingo">Domingo</option>
            </select>

            <button onclick="salvarEdicaoExercicio()">
                Salvar alterações
            </button>

            <button
                class="btnCancelar"
                onclick="fecharEdicao()"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- HISTÓRICO -->

    <div class="historico">

        <div class="tituloHistorico">

            <h2>📊 Histórico de Treinos</h2>

            <button
                class="btnLimpar"
                onclick="limparHistorico()"
            >
                Limpar histórico
            </button>

        </div>

        <div class="tabelaContainer">

            <table>

                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Dia</th>
                        <th>Exercício</th>
                        <th>Séries</th>
                        <th>Repetições / Peso</th>
                        <th>Volume</th>
                    </tr>
                </thead>

                <tbody id="listaTreinos"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
